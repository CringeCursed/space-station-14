#Spear with recall function
- type: entity
  id: WeaponSpearRatvar
  parent: BaseItem
  name: Ratvar Spear
  description: A razor-sharp spear made of brass.
  components:
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sharp
  - type: Sprite
    sprite: Objects/Weapons/Melee/spear.rsi
    layers:
    - state: spear
    - state: spear1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 15
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 25
  - type: Item
    size: Ginormous
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 2
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionInjectOnEmbed
    transferAmount: 2
    solution: melee
  - type: SolutionTransfer
    maxTransferAmount: 2
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Heat: 5
  - type: BindableWeapon
  - type: ActionGrant
    actions: 
      - ActionBindWeapon
  - type: ItemActionGrant
    actions:
      - ActionBindWeapon

- type: entity
  parent: BaseSword
  id: WeaponRatvarSword
  name: ratvar sword
  description: A magnificent clockwork sword that pulses with electromagnetic energy, disrupting electronics on each strike.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/clockworksword.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Slash: 10
        Shock: 5
    animation: WeaponArcSlash
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    size: Normal
    sprite: _Starlight/Objects/Weapons/Melee/clockworksword.rsi
  - type: EmpOnMeleeHit
    range: 4.0
    energyConsumption: 2500
    disableDuration: 10.0
    cooldown: 5.0
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 20

- type: entity
  name: ratvar bow
  parent: BaseItem
  id: RatvarWeaponsBow
# description: #TODO
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Basic/clock_bow.rsi
    layers:
    - state: unwielded
      map: [ base ]
    - state: animation-icon
      map: [ ammo-icon ]
      visible: true
  - type: Gun
    minAngle: 0
    maxAngle: 5
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/energybow.ogg
  - type: Wieldable
    wieldSound:
      path: /Audio/Items/bow_pull.ogg
  - type: GunRequiresWield
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
    rechargeSound:
      path: /Audio/_Starlight/Weapons/MagIn/energybowreload.ogg
  - type: BasicEntityAmmoProvider
    proto: ClockWorkEnergyArrow
    capacity: 1
    count: 1
  - type: AmmoCounter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        ammo-icon:
          True: { visible: True }
          False: { visible: False }
      enum.WieldableVisuals.Wielded:
        base:
          True: { state: wielded }
          False: { state: unwielded }

